name = "slip-lab-live-x-alerts"
main = "src/index.js"
compatibility_date = "2026-07-01"

[triggers]
crons = ["* * * * *"]

[vars]
AI_SAYS_URL = "https://www.thesliplab.com/data/ai_2.json"
MAX_EVENT_AGE_SECONDS = "180"
MAX_POSTS_PER_RUN = "1"
ELIGIBLE_SECTIONS = "TOP 5,TOP 10,ELITE SMASH,LIVE LONGSHOTS"
LIVE_AI_UPDATE_SECTIONS = "TOP 5,TOP 10,ELITE SMASH,HOMER AI,LIVE LONGSHOTS"
MIN_LIVE_AI_CONFIDENCE_MOVE = "10"
X_CALLED_IT_LIVE = "true"
X_LIVE_AI_UPDATE_DRY_RUN = "true"
