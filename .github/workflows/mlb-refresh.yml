name: The Slip Lab MLB Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull origin main --rebase

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run MLB refresh only
        timeout-minutes: 12
        run: node scripts/run_fast_refresh.js

      - name: Validate MLB data
        run: node scripts/mlb/validate_mlb_refresh.mjs

      - name: Commit refreshed MLB data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add website/data exports/content data exports || true

          git commit -m "Refresh MLB data" || echo "No changes to commit"

          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push failed. Syncing and retrying..."
            git pull origin main --rebase --autostash || true
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
