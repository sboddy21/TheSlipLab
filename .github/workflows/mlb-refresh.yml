name: The Slip Lab MLB Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync selected branch
        run: git pull origin "${GITHUB_REF_NAME}" --rebase

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run MLB refresh only
        timeout-minutes: 18
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run mlb:refresh

      - name: Validate MLB data
        run: npm run mlb:validate

      - name: Commit refreshed MLB data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add website/data exports/content data exports || true

          git commit -m "Refresh MLB data" || echo "No changes to commit"

          for i in 1 2 3; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "Push failed. Syncing and retrying..."
            git pull origin "${GITHUB_REF_NAME}" --rebase --autostash || true
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
