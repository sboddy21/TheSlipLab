name: The Slip Lab X Auto Posts

on:
  schedule:
    - cron: "35 13 * * *"
    - cron: "5 16 * * *"
    - cron: "5 19 * * *"
    - cron: "5 22 * * *"
    - cron: "30 2 * * *"
    # 1:30 a.m. Eastern: EDT and EST windows. Queue logic posts only in the 1 a.m. ET hour.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  post-x-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync selected branch
        run: git pull origin "${GITHUB_REF_NAME}" --rebase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inject environment variables
        run: |
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> .env
          echo "X_API_SECRET=${{ secrets.X_API_SECRET }}" >> .env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> .env
          echo "X_ACCESS_SECRET=${{ secrets.X_ACCESS_SECRET }}" >> .env
          echo "X_DRY_RUN=${{ secrets.X_DRY_RUN }}" >> .env

      - name: Build current X stories
        run: node scripts/build_x_content.js

      - name: Build current X queue
        run: node scripts/content/build_x_daily_queue_v2.js

      - name: Post X queue
        run: node scripts/content/post_x_queue.js

      - name: Commit updated data and queue
        if: always()
        run: |
          git config --global user.name "TheSlipLabBot"
          git config --global user.email "bot@thesliplab.com"
          git add website/data/content/x_daily_queue.json website/data/content/x_post_history.json exports/content/x_daily_queue.json exports/content/x_daily_queue.txt || true
          git diff --cached --quiet || git commit -m "Automated X posting update"

      - name: Push updates
        if: always()
        run: |
          for i in 1 2 3; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "Push failed. Syncing and retrying..."
            git pull origin "${GITHUB_REF_NAME}" --rebase --autostash || true
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
