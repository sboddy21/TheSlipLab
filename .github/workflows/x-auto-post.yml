name: The Slip Lab X Auto Posts

on:
  schedule:
    - cron: "35 13 * * *"
    - cron: "5 16 * * *"
    - cron: "5 19 * * *"
    - cron: "5 22 * * *"
    - cron: "30 2 * * *"
    # 1:30 a.m. Eastern: EDT and EST windows. Queue logic posts only in the 1 a.m. ET hour.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    # 5:30/6:30 a.m. Eastern retry. Duplicate protection prevents a second post.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Posting slot override"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - overnight

permissions:
  contents: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  post-x-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync selected branch
        run: git pull origin "${GITHUB_REF_NAME}" --rebase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inject environment variables
        run: |
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" >> .env
          echo "X_API_SECRET=${{ secrets.X_API_SECRET }}" >> .env
          echo "X_ACCESS_TOKEN=${{ secrets.X_ACCESS_TOKEN }}" >> .env
          echo "X_ACCESS_SECRET=${{ secrets.X_ACCESS_SECRET }}" >> .env
          echo "X_DRY_RUN=${{ secrets.X_DRY_RUN }}" >> .env

      - name: Resolve posting slot
        env:
          REQUESTED_SLOT: ${{ inputs.slot }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          SLOT="${REQUESTED_SLOT:-auto}"

          if [ "$SLOT" = "auto" ]; then
            case "$SCHEDULE_EXPRESSION" in
              "35 13 * * *") SLOT="morning" ;;
              "5 16 * * *") SLOT="midday" ;;
              "5 19 * * *") SLOT="afternoon" ;;
              "5 22 * * *") SLOT="pregame" ;;
              "30 2 * * *") SLOT="evening" ;;
              "30 10 * * *") SLOT="overnight" ;;
              "30 5 * * *"|"30 6 * * *")
                EASTERN_OFFSET=$(node -e "const name=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',timeZoneName:'shortOffset'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName')?.value||'';console.log(name);")

                if { [ "$SCHEDULE_EXPRESSION" = "30 5 * * *" ] && [ "$EASTERN_OFFSET" = "GMT-4" ]; } || { [ "$SCHEDULE_EXPRESSION" = "30 6 * * *" ] && [ "$EASTERN_OFFSET" = "GMT-5" ]; }; then
                  SLOT="overnight"
                else
                  SLOT="closed"
                fi
                ;;
              "") SLOT="" ;;
              *)
                echo "Unknown X posting schedule: $SCHEDULE_EXPRESSION"
                exit 1
                ;;
            esac
          fi

          echo "X_SLOT_OVERRIDE=$SLOT" >> "$GITHUB_ENV"
          echo "Resolved posting slot: ${SLOT:-automatic} (schedule: ${SCHEDULE_EXPRESSION:-manual})"

      - name: Refresh current MLB inputs
        if: env.X_SLOT_OVERRIDE != 'overnight' && env.X_SLOT_OVERRIDE != 'closed'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/run_fast_refresh.js

      - name: Build current game context
        if: env.X_SLOT_OVERRIDE != 'overnight' && env.X_SLOT_OVERRIDE != 'closed'
        run: node scripts/mlb/build_context_factors.js

      - name: Build current HR results
        if: env.X_SLOT_OVERRIDE != 'overnight' && env.X_SLOT_OVERRIDE != 'closed'
        run: node scripts/mlb/build_hr_results.js

      - name: Build verified model report
        if: env.X_SLOT_OVERRIDE == 'overnight'
        run: |
          REPORT_DATE=$(node -e "const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const date=new Date(parts+'T12:00:00Z');date.setUTCDate(date.getUTCDate()-1);console.log(date.toISOString().slice(0,10));")
          node scripts/mlb/build_hr_results.js --date="$REPORT_DATE" --out=website/data/mlb_results_previous.json
          node scripts/mlb/build_hr_calibration_report.js

      - name: Build current X stories
        run: node scripts/build_x_content.js

      - name: Build current X queue
        run: node scripts/content/build_x_daily_queue_v2.js

      - name: Render verified X graphic
        run: node scripts/content/render_x_graphics.js

      - name: Post X queue
        run: node scripts/content/post_x_queue.js

      - name: Commit updated data and queue
        if: success()
        run: |
          git config --global user.name "TheSlipLabBot"
          git config --global user.email "bot@thesliplab.com"
          git add website/data/mlb_results_previous.json website/data/content/x_daily_queue.json website/data/content/x_post_history.json website/data/hr_calibration_report.json exports/content/x_daily_queue.json exports/content/x_daily_queue.txt || true
          git diff --cached --quiet || git commit -m "Automated X posting update"

      - name: Push updates
        if: success()
        run: |
          for i in 1 2 3; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "Push failed. Syncing and retrying..."
            git pull origin "${GITHUB_REF_NAME}" --rebase --autostash || true
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
