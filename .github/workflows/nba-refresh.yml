name: The Slip Lab NBA Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nba-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run NBA refresh only
        timeout-minutes: 16
        run: node scripts/run_nba_refresh.js

      - name: Commit refreshed NBA data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/nba_*.json scripts/run_nba_refresh.js || true
          git commit -m "Refresh NBA data" || echo "No changes to commit"

          for i in 1 2 3; do
            git pull origin main --rebase || true
            git push origin HEAD:main && exit 0
            echo "Push failed. Retrying..."
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
