name: The Slip Lab NBA Refresh

on:
  schedule:
    # Every 30 minutes during the NBA preseason and regular/postseason months.
    - cron: "*/30 * * 10-12,1-6 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run NBA refresh only
        timeout-minutes: 16
        run: node scripts/run_nba_refresh.js

      - name: Validate refreshed NBA foundation
        run: node --test tests/nba-foundation.test.mjs tests/nba-first-basket.test.mjs tests/nba-market-gate.test.mjs tests/nba-results-calibration.test.mjs tests/nba-results-page.test.mjs tests/nba-live-workspace.test.mjs tests/nba-prop-trends.test.mjs

      - name: Commit refreshed NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/nba_*.json data/nba/first_basket_history.json
          git commit -m "Refresh NBA data" || echo "No changes to commit"

          node scripts/publish-refresh.mjs
