name: The Slip Lab College Football Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * 1,8-12 *'
permissions:
  contents: write
concurrency:
  group: production-data-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check college football data guards
        run: node --test tests/cfb.test.mjs
      - name: Refresh college football board and settle recorded leans
        run: node scripts/cfb/refresh.mjs
      - name: Commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/cfb_board.json data/cfb/live-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh college football board"
          git pull origin "$GITHUB_REF_NAME" --rebase
          git push origin "HEAD:$GITHUB_REF_NAME"
