name: The Slip Lab NFL Refresh

on:
  workflow_dispatch:
  schedule:
    # Keep every current NFL feed inside the one-hour freshness contract, including deployment time.
    - cron: "*/30 * * 1-2,8-12 *"

permissions:
  contents: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify complete NFL data and model safeguards
        run: node --test tests/nfl-*.test.mjs
      - name: Refresh NFL signals, live stats, and final results
        run: node scripts/run_nfl_refresh.js
      - name: Commit refreshed NFL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/nfl_*.json data/nfl/current_usage_games.json
          git commit -m "Refresh NFL data" || echo "No changes to commit"
          git pull origin "$GITHUB_REF_NAME" --rebase
          git push origin "HEAD:$GITHUB_REF_NAME"
