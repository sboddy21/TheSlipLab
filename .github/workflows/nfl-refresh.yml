name: The Slip Lab NFL Refresh

on:
  workflow_dispatch:
  schedule:
    # Three lean daily passes: after late games, morning reconciliation, and pregame roster refresh.
    # Game-window passes keep member trackers current without running continuously all week.
    - cron: "17 5,14,22 * 1-2,8-12 *"
    - cron: "*/30 0-5,17-23 * 1-2,8-12 0-4"

permissions:
  contents: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh NFL signals, live stats, and final results
        run: node scripts/run_nfl_refresh.js
      - name: Commit refreshed NFL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/nfl_*.json
          git commit -m "Refresh NFL data" || echo "No changes to commit"
          git pull origin "$GITHUB_REF_NAME" --rebase
          git push origin "HEAD:$GITHUB_REF_NAME"
