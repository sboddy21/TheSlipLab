name: The Slip Lab NCAAM Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * 11,12,1,2,3,4 *'
permissions:
  contents: write
concurrency:
  group: production-data-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/
            /tests/ncaam*.mjs
            /website/assets/odds-core.mjs
            /website/lib/data-freshness.mjs
            /website/lib/current-season.mjs
            /website/data/ncaam*.json
            /website/data/odds_ncaam.json
            /data/ncaam/current-history.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ncaam:test
      - run: npm run ncaam:refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: sportsbook-api2.p.rapidapi.com
      - name: Commit NCAAM data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/ncaam_board.json website/data/ncaam_results.json website/data/odds_ncaam.json website/data/ncaam_picks.json data/ncaam/current-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NCAAM data"
          git pull origin "$GITHUB_REF_NAME" --rebase
          git push origin "HEAD:$GITHUB_REF_NAME"
