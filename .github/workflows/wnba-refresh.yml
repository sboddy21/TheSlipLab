name: The Slip Lab WNBA Refresh

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes during the WNBA season (May through October).
    - cron: "*/15 * * 5-10 *"

permissions:
  contents: write

concurrency:
  group: production-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify betting market safeguards
        run: node --test tests/wnba-market-gate.test.mjs tests/wnba-public-evidence.test.mjs
      - name: Refresh WNBA foundation data
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/run_wnba_refresh.js
      - name: Commit refreshed WNBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/wnba_market_lines.json website/data/wnba_games_today.json website/data/wnba_player_baselines.json website/data/wnba_team_baselines.json website/data/wnba_projection_board.json website/data/wnba_projection_history.json website/data/wnba_calibration.json website/data/wnba_live_snapshot.json website/data/wnba_change_feed.json website/data/wnba_verified_markets.json
          git commit -m "Refresh WNBA data" || echo "No changes to commit"
          git pull origin "$GITHUB_REF_NAME" --rebase
          git push origin "HEAD:$GITHUB_REF_NAME"
