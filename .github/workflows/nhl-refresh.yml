name: The Slip Lab NHL Refresh
on:
  workflow_dispatch:
  schedule:
    # Morning baseline, afternoon lineup pass, then 15-minute live updates.
    - cron: "17 13,19 * 9-12,1-6 *"
    - cron: "2,17,32,47 22-23,0-6 * 9-12,1-6 *"
permissions:
  contents: write
concurrency:
  group: production-data-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify NHL calculations
        run: npm run nhl:test
      - name: Refresh NHL board
        run: npm run nhl:refresh
      - name: Commit NHL board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data/nhl_board.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NHL board"
          git pull origin "$GITHUB_REF_NAME" --rebase
          git push origin "HEAD:$GITHUB_REF_NAME"
