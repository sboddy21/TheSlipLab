name: Update HR Results

on:
  workflow_dispatch:
  schedule:
    # Once after the MLB slate, rather than rebuilding historical reports every 15 minutes.
    - cron: "15 11 * * *"

permissions:
  contents: write

jobs:
  check_live_games:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      live_games: ${{ steps.mlb_status.outputs.live_games }}
      live_game_count: ${{ steps.mlb_status.outputs.live_game_count }}
    steps:
      - name: Check for live MLB games
        id: mlb_status
        shell: bash
        run: |
          slate_date="$(TZ=America/New_York date +%F)"
          schedule_url="https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${slate_date}"
          schedule="$(curl --fail --silent --show-error --retry 2 --max-time 20 "${schedule_url}")"
          live_game_count="$(jq '[.dates[]?.games[]? | select(.status.abstractGameState == "Live")] | length' <<<"${schedule}")"

          echo "live_game_count=${live_game_count}" >> "${GITHUB_OUTPUT}"
          if (( live_game_count > 0 )); then
            echo "live_games=true" >> "${GITHUB_OUTPUT}"
            echo "Found ${live_game_count} live MLB game(s); HR results refresh will run."
          else
            echo "live_games=false" >> "${GITHUB_OUTPUT}"
            echo "No live MLB games; skipping the HR results refresh."
          fi

  update-hr-results:
    needs: check_live_games
    # Cloudflare dispatches this workflow every five minutes. Only live games need
    # that cadence; the daily scheduled run remains as a final reconciliation.
    if: >-
      ${{ always() &&
          (github.event_name == 'schedule' ||
           needs.check_live_games.outputs.live_games == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: production-data-writers
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync selected branch
        run: git pull origin "${GITHUB_REF_NAME}" --rebase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build current game context
        run: node scripts/mlb/build_context_factors.js

      - name: Build live HR results
        run: node scripts/mlb/build_hr_results.js

      - name: Build previous day HR results
        run: |
          PREV_DATE=$(node -e "const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);console.log(d.toISOString().slice(0,10));")
          node scripts/mlb/build_hr_results.js --date=$PREV_DATE --out=website/data/mlb_results_previous.json

      - name: Build HR results history
        run: node scripts/mlb/build_hr_results_history.js

      - name: Build ball carry index
        run: node scripts/mlb/build_ball_carry_index.js

      - name: Rebuild verified HR calibration
        run: node scripts/mlb/build_hr_calibration_report.js

      - name: Rebuild verified AI Hall of Fame
        run: node scripts/build_hr_ai_hof.cjs

      - name: Commit updated HR results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add website/data/mlb_context_factors.json website/data/mlb_results.json website/data/mlb_results_previous.json website/data/hr_results_history.json website/data/mlb_ball_carry_index.json website/data/hr_calibration_report.json website/data/hr_ai_hof.json || true
          git commit -m "Update HR results" || echo "No changes to commit"

          for i in 1 2 3; do
            git pull origin "${GITHUB_REF_NAME}" --rebase || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "Push failed. Retrying..."
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
