name: Update HR Results

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hr-results
  cancel-in-progress: false

jobs:
  update-hr-results:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build live HR results
        run: node scripts/mlb/build_hr_results.js

      - name: Build previous day HR results
        run: |
          PREV_DATE=$(node -e "const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));d.setDate(d.getDate()-1);console.log(d.toISOString().slice(0,10));")
          node scripts/mlb/build_hr_results.js --date=$PREV_DATE --out=website/data/mlb_results_previous.json

      - name: Build HR results history
        run: node scripts/mlb/build_hr_results_history.js

      - name: Stamp update time
        if: always()
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('website/data',{recursive:true});fs.writeFileSync('website/data/site_last_updated.json',JSON.stringify({updatedAt:new Date().toISOString(),updated_at:new Date().toISOString(),source:'hr_results_workflow_5_min'},null,2));"

      - name: Commit updated HR results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add website/data/mlb_results.json website/data/mlb_results_previous.json website/data/hr_results_history.json website/data/site_last_updated.json || true
          git commit -m "Update HR results" || echo "No changes to commit"

          for i in 1 2 3; do
            git pull origin main --rebase || true
            git push origin HEAD:main && exit 0
            echo "Push failed. Retrying..."
            sleep 10
          done

          echo "Push failed after retries"
          exit 1
