<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Slip Lab | NBA Decision Center</title>
  <style>
    :root{
      --bg:#050814;
      --panel:#0b1220;
      --panel2:#111a2d;
      --text:#f5f7fb;
      --muted:#99a6bd;
      --line:rgba(255,255,255,.1);
      --good:#41f0a6;
      --warn:#ffd166;
      --hot:#ff5c7a;
      --blue:#5cc8ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:
        radial-gradient(circle at top left, rgba(92,200,255,.14), transparent 30%),
        radial-gradient(circle at top right, rgba(255,92,122,.12), transparent 28%),
        var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1400px;margin:0 auto;padding:22px}
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:20px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .logo{
      width:38px;height:38px;border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--hot));
      box-shadow:0 0 30px rgba(92,200,255,.25);
    }
    .nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav a{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.04);
      color:var(--muted);
      font-weight:800;
      font-size:13px;
    }
    .nav a.active{color:var(--text);border-color:rgba(92,200,255,.45)}
    .hero{
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg,rgba(17,26,45,.92),rgba(11,18,32,.9));
      padding:26px;
      margin-bottom:18px;
      box-shadow:0 18px 70px rgba(0,0,0,.28);
    }
    .hero h1{
      margin:0 0 8px;
      font-size:clamp(30px,4vw,54px);
      line-height:1;
      letter-spacing:-.04em;
    }
    .hero p{margin:0;color:var(--muted);font-weight:700}
    .metrics{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-top:18px;
    }
    .metric{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:20px;
      padding:14px;
    }
    .metric span{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .metric strong{display:block;font-size:28px;margin-top:4px}
    .tabs{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:18px 0;
    }
    .tab{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      color:var(--muted);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }
    .tab.active{
      color:var(--text);
      border-color:rgba(92,200,255,.55);
      background:rgba(92,200,255,.12);
    }
    .section{
      margin-top:18px;
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:14px;
      margin-bottom:12px;
    }
    .section-head h2{margin:0;font-size:24px}
    .section-head p{margin:0;color:var(--muted);font-weight:700}
    .grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
    }
    .card{
      border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(17,26,45,.94),rgba(9,14,26,.94));
      border-radius:22px;
      padding:14px;
      min-height:250px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at top right,rgba(92,200,255,.14),transparent 38%);
      pointer-events:none;
    }
    .card.elite:before{background:radial-gradient(circle at top right,rgba(65,240,166,.18),transparent 42%)}
    .card.strong:before{background:radial-gradient(circle at top right,rgba(255,209,102,.18),transparent 42%)}
    .card.watch:before{background:radial-gradient(circle at top right,rgba(255,92,122,.16),transparent 42%)}
    .rank{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      position:relative;
      z-index:1;
    }
    .pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 9px;
      font-size:12px;
      font-weight:900;
      color:var(--muted);
      background:rgba(255,255,255,.04);
    }
    .score{
      font-size:28px;
      font-weight:1000;
      color:var(--good);
    }
    .name{
      position:relative;
      z-index:1;
      margin:14px 0 2px;
      font-size:20px;
      font-weight:1000;
      letter-spacing:-.02em;
    }
    .sub{
      position:relative;
      z-index:1;
      color:var(--muted);
      font-size:13px;
      font-weight:800;
      margin-bottom:12px;
    }
    .mini{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
      margin:12px 0;
    }
    .box{
      border:1px solid var(--line);
      border-radius:14px;
      padding:9px;
      background:rgba(255,255,255,.035);
    }
    .box span{
      display:block;
      color:var(--muted);
      font-size:10px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.07em;
    }
    .box strong{
      display:block;
      margin-top:3px;
      font-size:16px;
    }
    .tags{
      position:relative;
      z-index:1;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:12px;
    }
    .tag{
      border:1px solid var(--line);
      border-radius:999px;
      padding:5px 8px;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      background:rgba(0,0,0,.12);
    }
    .reason{
      position:relative;
      z-index:1;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      line-height:1.35;
      margin-top:10px;
    }
    .empty{
      border:1px dashed var(--line);
      border-radius:22px;
      padding:22px;
      color:var(--muted);
      font-weight:800;
    }
    @media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){
      .wrap{padding:14px}
      .top{align-items:flex-start;flex-direction:column}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="brand" href="./index.html">
        <span class="logo"></span>
        <span>The Slip Lab</span>
      </a>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a class="active" href="./nba.html">NBA Decision Center</a>
        <a href="./nba-points.html">Points Board</a>
        <a href="./nba-matchups.html">Matchups</a>
        <a href="./nba-rebounds.html">Rebounds</a>
        <a href="./nba-assists.html">Assists</a>
        <a href="./nba-threes.html">Threes</a>
      </nav>
    </div>

    <section class="hero">
      <h1>NBA Decision Center</h1>
      <p id="subtitle">Loading NBA points engine</p>
      <div class="metrics">
        <div class="metric"><span>Players</span><strong id="playerCount">--</strong></div>
        <div class="metric"><span>Sections</span><strong id="sectionCount">--</strong></div>
        <div class="metric"><span>Market</span><strong id="market">Points</strong></div>
        <div class="metric"><span>Updated</span><strong id="updated">--</strong></div>
      </div>
    </section>

    <div class="tabs" id="tabs"></div>
    <section id="content"></section>
  </main>

  <script>
    const SECTION_LABELS = {
      bestPointsPlays: "Best Points Plays",
      usageRisers: "Usage Risers",
      minutesMonsters: "Minutes Monsters",
      scoringForm: "Scoring Form",
      safeFloor: "Safe Floor",
      boomCandidates: "Boom Candidates",
      defenseTargets: "Defense Targets",
      toughDefenseWarnings: "Tough Defense Warnings",
      watchList: "Watch List"
    };

    let DATA = null;
    let ACTIVE = "bestPointsPlays";

    function clean(v, fallback = "--") {
      return v === undefined || v === null || v === "" ? fallback : String(v);
    }

    function html(v) {
      return clean(v, "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function fmt(v) {
      const n = num(v);
      return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    function niceDate(iso) {
      if (!iso) return "--";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "--";
      return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    async function getJSON(file) {
      const res = await fetch(file + "?v=" + Date.now());
      if (!res.ok) throw new Error(file + " failed");
      return await res.json();
    }

    function cardClass(p) {
      if (num(p.pointsScore) >= 85) return "elite";
      if (num(p.pointsScore) >= 70) return "strong";
      if (num(p.pointsScore) >= 55) return "watch";
      return "";
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      const sections = DATA.sections || {};
      tabs.innerHTML = Object.keys(SECTION_LABELS).filter(key => sections[key]).map(key => {
        const count = Array.isArray(sections[key]) ? sections[key].length : 0;
        return `<button class="tab ${key === ACTIVE ? "active" : ""}" data-key="${key}">${SECTION_LABELS[key]} (${count})</button>`;
      }).join("");

      tabs.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          ACTIVE = btn.dataset.key;
          renderTabs();
          renderSection();
        });
      });
    }

    function renderCard(p, i) {
      return `
        <article class="card ${cardClass(p)}">
          <div class="rank">
            <span class="pill">#${html(p.rank || i + 1)}</span>
            <span class="score">${html(fmt(p.pointsScore))}</span>
          </div>
          <div class="name">${html(p.player)}</div>
          <div class="sub">${html(p.team)} vs ${html(p.opponent)} • ${html(p.position)} • ${html(p.homeAway)}</div>

          <div class="mini">
            <div class="box"><span>Lean</span><strong>${html(fmt(p.pointsLean))}</strong></div>
            <div class="box"><span>Minutes</span><strong>${html(fmt(p.expectedMinutes))}</strong></div>
            <div class="box"><span>Usage</span><strong>${html(fmt(p.usageScore))}</strong></div>
            <div class="box"><span>Trend</span><strong>${html(fmt(p.trendDiff))}</strong></div>
          </div>

          <div class="tags">
            ${(Array.isArray(p.tags) ? p.tags.slice(0, 5) : []).map(tag => `<span class="tag">${html(tag)}</span>`).join("")}
          </div>

          <div class="reason">${html(p.reason || p.confidence || "")}</div>
        </article>
      `;
    }

    function renderSection() {
      const content = document.getElementById("content");
      const rows = DATA.sections?.[ACTIVE] || [];
      const label = SECTION_LABELS[ACTIVE] || ACTIVE;

      content.innerHTML = `
        <section class="section">
          <div class="section-head">
            <div>
              <h2>${html(label)}</h2>
              <p>${rows.length} players loaded from NBA Decision Center</p>
            </div>
          </div>
          ${rows.length ? `<div class="grid">${rows.map(renderCard).join("")}</div>` : `<div class="empty">No players available for this section yet.</div>`}
        </section>
      `;
    }

    async function boot() {
      DATA = await getJSON("./data/nba_decision_center.json");

      document.getElementById("subtitle").textContent =
        `${clean(DATA.market, "Points")} board • ${clean(DATA.date)} • ${clean(DATA.source)}`;
      document.getElementById("playerCount").textContent = clean(DATA.playerCount);
      document.getElementById("sectionCount").textContent = clean(DATA.sectionCount);
      document.getElementById("market").textContent = clean(DATA.market, "Points");
      document.getElementById("updated").textContent = niceDate(DATA.fetchedAt);

      renderTabs();
      renderSection();
    }

    boot().catch(err => {
      document.getElementById("content").innerHTML = `<div class="empty">${html(err.message)}</div>`;
    });
  </script>
</body>
</html>
