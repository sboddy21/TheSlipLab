<script>
const sections = [
  ["bestPicks","Best HR Picks"],
  ["safestPlays","Safest Plays"],
  ["bestValue","Best Value"],
  ["lottoBombs","Live Longshots"],
  ["pitchTypeEdges","Pitch Edges"],
  ["weatherCarry","Weather Carry"],
  ["bullpenBoosts","Bullpen Boosts"],
  ["dueForHr","Due For HR"],
  ["perfectStorm","Perfect Storm"],
  ["nuclearSpots","Nuclear Spots"]
];

let active = "bestPicks";
let data = null;
let boardExpiresAt = 0;

function withholdBoard(message){
  data = null;
  document.getElementById("status").textContent = message;
  for (const id of ["pickOnePanel", "topTargets", "tabs", "grid"]) document.getElementById(id).replaceChildren();
}

function verifiedBoardDeadline(board, health){
  const now = Date.now();
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const updated = Date.parse(board?.updatedAt);
  const until = Date.parse(health?.monitoring?.freshUntil);
  if (health?.status !== "healthy" || health?.monitoring?.state !== "live" || health?.slateDate !== today || board?.pitcherDate !== today || !Number.isFinite(updated) || updated > now + 1000 || !Number.isFinite(until)) return 0;
  const required = Object.values(health.artifacts || {}).filter(row => row.required);
  if (!required.length) return 0;
  const deadlines = required.map(row => {
    const timestamp = Date.parse(row.timestamp);
    const limit = row.maxAgeSeconds || (["mlb_home_runs.json", "game_pitcher_matchups.json"].includes(row.file) ? 4200 : 900);
    return row.freshness === "current" && Number.isFinite(timestamp) && timestamp <= now + 1000 ? timestamp + limit * 1000 : 0;
  });
  return Math.min(until, updated + 900000, ...deadlines);
}

function clean(v){return v === null || v === undefined || v === "" ? "N/A" : String(v)}
function num(v){const n = Number(v); return Number.isFinite(n) ? n : 0}
function score(v){return num(v).toFixed(1)}
function isConfirmedLineupPlayer(row){const status=String(row.lineupStatus||"").trim().toUpperCase();const source=String(row.lineupSource||"").trim().toUpperCase();return ![status,source].some(value=>["NOT IN LINEUP","NOT_IN_LINEUP","BENCH","NOT STARTING","NOT_STARTING"].includes(value));}
function playerLineupKey(row){return `${String(row?.player||row?.name||"").trim().toLowerCase()}|${String(row?.team||"").trim().toLowerCase()}`;}

function allRows(){
  const map = new Map();

  [
    ...(data?.allPlayers || []),
    ...Object.values(data?.sections || {}).flat()
  ].forEach(row => {
    const key = `${row.player}|${row.team}|${row.opponent}`;
    if (!map.has(key)) map.set(key, row);
  });

  return [...map.values()];
}

function rowsFor(key){
  const direct = data?.sections?.[key] || [];
  if (direct.length) return direct;

  const rows = allRows();

  if (key === "bestValue") {
    return rows
      .map(r => ({
        ...r,
        valueScore:
          num(r.pitchEdge) * 0.34 +
          num(r.pitcherRisk) * 0.24 +
          num(r.zoneOverlap) * 0.16 +
          num(r.bullpen) * 0.10 +
          num(r.weather) * 0.08 +
          num(r.due) * 0.08 -
          num(r.seasonHr) * 2.2 -
          Math.max(0, num(r.hrConfidence) - 48) * 1.6 -
          Math.max(0, num(r.powerScore) - 58) * 1.2
      }))
      .filter(r =>
        num(r.seasonHr) <= 10 &&
        num(r.pitchEdge) >= 35 &&
        num(r.pitcherRisk) >= 35 &&
        num(r.hrConfidence) <= 52 &&
        num(r.powerScore) <= 58
      )
      .sort((a,b) => num(b.valueScore) - num(a.valueScore))
      .slice(0, 40);
  }

  if (key === "pitchTypeEdges") {
    return rows
      .filter(r => num(r.pitchEdge) > 0)
      .sort((a,b) => num(b.pitchEdge) - num(a.pitchEdge))
      .slice(0, 40);
  }

  if (key === "weatherCarry") {
    return rows
      .filter(r => num(r.weather) > 0)
      .sort((a,b) => num(b.weather) - num(a.weather))
      .slice(0, 40);
  }

  if (key === "bullpenBoosts") {
    return rows
      .filter(r => num(r.bullpen) > 0)
      .sort((a,b) => num(b.bullpen) - num(a.bullpen))
      .slice(0, 40);
  }

  if (key === "dueForHr") {
    return rows
      .filter(r =>
        num(r.due) >= 10 &&
        num(r.powerScore) >= 45 &&
        num(r.seasonHr) <= 10
      )
      .map(r => ({
        ...r,
        dueScore:
          num(r.due) * 3.0 +
          num(r.powerScore) * 0.55 +
          num(r.pitcherRisk) * 0.25 +
          num(r.bullpen) * 0.15 -
          num(r.seasonHr) * 1.2
      }))
      .sort((a,b) => num(b.dueScore) - num(a.dueScore))
      .slice(0, 40);
  }

  if (key === "perfectStorm") {
    return rows
      .filter(r =>
        num(r.powerScore) >= 53 &&
        num(r.pitcherRisk) >= 55 &&
        num(r.bullpen) >= 50 &&
        num(r.due) >= 8
      )
      .map(r => ({
        ...r,
        stormScore:
          num(r.powerScore) * 0.30 +
          num(r.pitcherRisk) * 0.26 +
          num(r.pitchEdge) * 0.18 +
          num(r.bullpen) * 0.16 +
          num(r.due) * 1.60 +
          num(r.hrConfidence) * 1.10
      }))
      .sort((a,b) => num(b.stormScore) - num(a.stormScore))
      .slice(0, 40);
  }

  if (key === "nuclearSpots") {
    return rows
      .filter(r =>
        num(r.hrConfidence) >= 10 &&
        num(r.powerScore) >= 65 &&
        num(r.pitcherRisk) >= 70 &&
        num(r.bullpen) >= 50
      )
      .map(r => ({
        ...r,
        nuclearScore:
          num(r.hrConfidence) * 3.5 +
          num(r.powerScore) * 0.38 +
          num(r.pitcherRisk) * 0.32 +
          num(r.pitchEdge) * 0.18 +
          num(r.bullpen) * 0.12
      }))
      .sort((a,b) => num(b.nuclearScore) - num(a.nuclearScore))
      .slice(0, 25);
  }

  return direct;
}

function topTargetScore(row){
  return (
    num(row.hrConfidence) * 4.0 +
    num(row.powerScore) * 0.35 +
    num(row.pitcherRisk) * 0.22 +
    num(row.pitchEdge) * 0.18 +
    num(row.bullpen) * 0.12 +
    num(row.due) * 1.25
  );
}

function renderPickOnePanel(){
  let box = document.getElementById("pickOnePanel");
  if(!box){
    const tabs = document.getElementById("tabs");
    if(!tabs) return;
    tabs.insertAdjacentHTML("beforebegin", `<section class="pick-one-panel" id="pickOnePanel"></section>`);
    box = document.getElementById("pickOnePanel");
  }

  const picks = data?.sections?.ifOnlyOne?.picks || data?.ifOnlyOne?.picks || {};

  const cards = [
    ["bestOverall", "🏆", "Best Overall"],
    ["safestPlay", "🛡", "Safest HR Look"],
    ["highestCeiling", "🚀", "Highest Ceiling"],
    ["bestWeatherPlay", "🌤", "Best Weather"],
    ["bestPitchMatchup", "🎯", "Best Pitch Matchup"],
    ["bestLongshot", "💣", "Best Longshot"]
  ].map(([key, icon, label]) => {
    const p = picks[key];
    if(!p) return "";

    const displayScore = p.pickOneScore || p.hrConfidence || p.score || 0;

    return `
      <article class="pick-one-card" data-player="${clean(p.player || "")}" data-player-id="${p.playerId || ""}" data-game-id="${p.gamePk || ""}" data-team="${clean(p.team || "")}">
        <div class="pick-one-card-top">
          <span>${icon} ${label}</span>
          <b>${clean(p.tier || p.type || p.label || "")}</b>
        </div>
        <h3>${clean(p.player || "N/A")}</h3>
        <p>${clean(p.team || "")} ${p.opponent ? "vs " + clean(p.opponent) : ""}</p>
        <div class="pick-one-score">${Number(displayScore || 0).toFixed(1)}</div>
        <div class="pick-one-meta">
          <span>Power ${Number(p.powerScore || 0).toFixed(1)}</span>
          <span>Pitch ${Number(p.pitchEdge || 0).toFixed(1)}</span>
          <span>Zones ${Number(p.zoneOverlap || 0).toFixed(1)}</span>
        </div>
      </article>
    `;
  }).join("");

  box.innerHTML = `
    <div class="pick-one-head">
      <div>
        <span>Decision Shortcut</span>
        <h2>If I Can Only Pick One</h2>
      </div>
      <p>The fastest way to see where the slate starts.</p>
    </div>
    <div class="pick-one-grid">${cards || `<div class="empty">Pick one board is waiting for today’s HR rows.</div>`}</div>
  `;

  box.querySelectorAll(".pick-one-card").forEach(card => {
    card.addEventListener("click", () => {
      const player = card.dataset.player;
      if(window.openPlayerCard && player) window.openPlayerCard(player);
    });
  });
}


function renderTopTargets(){
  const rows = allRows()
    .map(r => ({...r, topTargetScore: topTargetScore(r)}))
    .sort((a,b) => num(b.topTargetScore) - num(a.topTargetScore))
    .slice(0, 10);

  document.getElementById("topTargets").innerHTML = `
    <div class="top-targets-head">
      <div>
        <div class="top-targets-title">🔥 Today's Top 10 HR Targets</div>
        <div class="top-targets-sub">Built from confidence, power, pitcher risk, pitch edge, bullpen and due signals.</div>
      </div>
      <div class="top-targets-sub">${rows.length} targets</div>
    </div>
    <div class="top-targets-grid">
      ${rows.map((row,index) => `
        <article class="top-target" data-player-name="${clean(row.player)}" data-player-id="${row.playerId || ""}" data-game-id="${row.gamePk || ""}" data-team="${clean(row.team || "")}">
          <div>
            <div class="top-target-rank">#${index + 1}</div>
            <div class="top-target-name">${clean(row.player)}</div>
            <div class="top-target-meta">${clean(row.team)} vs ${clean(row.opponent)}</div>
          </div>
          <div>
            <div class="top-target-score">${score(row.hrConfidence)}</div>
            <div class="top-target-meta">HR Conf</div>
          </div>
        </article>
      `).join("")}
    </div>
  `;
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = sections.map(([key,label]) => {
    const count = rowsFor(key).length;
    return `
      <button class="tab ${key === active ? "active" : ""}" data-key="${key}">
        ${label} ${count ? `<span style="opacity:.65">(${count})</span>` : ""}
      </button>
    `;
  }).join("");

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      active = btn.dataset.key;
      renderTabs();
      renderGrid();
    });
  });
}

function renderGrid(){
  const rows = rowsFor(active);

  if (!rows.length) {
    document.getElementById("grid").innerHTML = `
      <div class="card">
        <div class="name">No plays in this bucket yet</div>
        <div class="why">This tab has no qualified players from the current data run.</div>
      </div>
    `;
    return;
  }

  document.getElementById("grid").innerHTML = rows.map(row => `
    <article class="card player-card" data-player-name="${clean(row.player)}" data-player-id="${row.playerId || ""}" data-game-id="${row.gamePk || ""}" data-team="${clean(row.team || "")}">
      <div class="tier">${clean(row.tier)}</div>

      <div class="card-top">
        <div>
          <div class="name">${clean(row.player)}</div>
          <div class="meta">${clean(row.team)} vs ${clean(row.opponent)}</div>
          <div class="meta" style="color:#8cff32">
            ${row.confirmedLineup
              ? "Confirmed " + (row.lineupSpot ? "#" + row.lineupSpot : "") + (row.lineupRole ? " • " + clean(row.lineupRole) : "")
              : "Lineup Not Confirmed"}
          </div>
        </div>

        <div>
          <div class="label">HR Conf</div>
          <div class="score">${score(row.hrConfidence)}</div>
        </div>
      </div>

      <div class="meter">
        <div class="fill" style="width:${Math.min(100, num(row.hrConfidence))}%"></div>
      </div>

      <div class="metrics">
        <div class="metric"><div class="metric-label">Power</div><div class="metric-value">${score(row.powerScore)}</div></div>
        <div class="metric"><div class="metric-label">Pitch Edge</div><div class="metric-value">${score(row.pitchEdge)}</div></div>
        <div class="metric"><div class="metric-label">Pitcher Risk</div><div class="metric-value">${score(row.pitcherRisk)}</div></div>
        <div class="metric"><div class="metric-label">Weather</div><div class="metric-value">${score(row.weather)}</div></div>
        <div class="metric"><div class="metric-label">Spot</div><div class="metric-value">${row.lineupSpot ? "#" + clean(row.lineupSpot) : "-"}</div></div>
        <div class="metric"><div class="metric-label">PA</div><div class="metric-value">${num(row.projectedPlateAppearances || 0).toFixed(2)}</div></div>
        <div class="metric"><div class="metric-label">Lineup Boost</div><div class="metric-value">${num(row.lineupBoost || 0) >= 0 ? "+" : ""}${num(row.lineupBoost || 0).toFixed(1)}</div></div>
        <div class="metric"><div class="metric-label">Protection</div><div class="metric-value">${score(row.protectionScore)}</div></div>
        <div class="metric"><div class="metric-label">Bullpen</div><div class="metric-value">${score(row.bullpen)}</div></div>
        <div class="metric"><div class="metric-label">Due</div><div class="metric-value">${score(row.due)}</div></div>
      </div>

      <div class="pitch">
        <div class="pitch-label">Best Pitch Matchup</div>
        <div class="pitch-value">${clean(row.bestPitch)}</div>
      </div>

      <div class="why">
        ${(row.reasons && row.reasons.length) ? row.reasons.join(", ") : "HR profile connected."}
      </div>
    </article>
  `).join("");
}

async function load(){
  try {
  const responses = await Promise.all(["hr_decision_center.json", "health_status.json"].map(file => fetch("./data/" + file + "?v=" + Date.now(), { cache: "no-store", signal: AbortSignal.timeout(15000) })));
  if (responses.some(response => !response.ok)) throw new Error("Current MLB data could not be loaded. Recommendations are withheld.");
  const [board, health] = await Promise.all(responses.map(response => response.json()));
  boardExpiresAt = verifiedBoardDeadline(board, health);
  if (boardExpiresAt <= Date.now()) throw new Error("MLB inputs are delayed or unverified. Recommendations are withheld until a current refresh is available.");
  data = board;
  data.allPlayers = (data.allPlayers || []).filter(isConfirmedLineupPlayer);
  const confirmedKeys = new Set(data.allPlayers.map(playerLineupKey));
  Object.entries(data.sections || {}).forEach(([key, value]) => {
    if (Array.isArray(value)) data.sections[key] = value.filter(row => confirmedKeys.has(playerLineupKey(row)));
  });
  const pickSection = data.sections?.ifOnlyOne;
  if (pickSection?.picks) pickSection.picks = Object.fromEntries(Object.entries(pickSection.picks).filter(([, row]) => confirmedKeys.has(playerLineupKey(row))));
  data.totalPlayers = data.allPlayers.length;

  document.getElementById("status").textContent =
    `Updated ${new Date(data.updatedAt).toLocaleString()} • ${data.totalPlayers} HR candidates`;

  renderPickOnePanel();
  renderTopTargets();
  renderTabs();
  renderGrid();
  } catch (error) {
    withholdBoard(error.message || "Current MLB recommendations are unavailable.");
  }
}

load();
setInterval(() => { if (data && Date.now() >= boardExpiresAt) withholdBoard("MLB inputs have expired. Recommendations are withheld pending a current refresh."); }, 15000);
</script>
