    /* Shared The Slip Lab header */

      z-index:99999;
    }
    .tsl-site-header-inner{
      max-width:1800px;

      padding:14px 22px;
      display:flex;

      scrollbar-width:none;

      flex:0 0 auto;

      gap:10px;
      flex-wrap:nowrap;
      white-space:nowrap;
      flex:0 0 auto;
    }
    .tsl-nav a{
      color:#f4fff8;
      text-decoration:none;
      background:#101719;
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      padding:10px 17px;
      font-size:14px;
      font-weight:950;
      line-height:1;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .tsl-nav a.active{
      background:#7cff24;
      border-color:#7cff24;
      color:#061006;
      box-shadow:0 0 22px rgba(124,255,36,.18);
    }
    body{margin-top:0!important}
    @media(max-width:900px){
      .tsl-site-header-inner{padding:12px 14px;gap:14px}
      .tsl-brand{font-size:20px}
      .tsl-nav a{font-size:12px;padding:9px 12px;border-radius:14px}
