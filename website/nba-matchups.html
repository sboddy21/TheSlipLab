<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Slip Lab | NBA Matchup Engine</title>
  <style>
    :root{--bg:#050814;--panel:#0b1220;--text:#f5f7fb;--muted:#99a6bd;--line:rgba(255,255,255,.1);--good:#41f0a6;--warn:#ffd166;--hot:#ff5c7a;--blue:#5cc8ff}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top left,rgba(92,200,255,.14),transparent 30%),radial-gradient(circle at top right,rgba(255,92,122,.12),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1500px;margin:0 auto;padding:22px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--hot))}
    .nav{display:flex;gap:10px;flex-wrap:wrap}
    .nav a{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);font-weight:800;font-size:13px}
    .nav a.active{color:var(--text);border-color:rgba(92,200,255,.45)}
    .hero{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(17,26,45,.92),rgba(11,18,32,.9));padding:26px;margin-bottom:18px}
    .hero h1{margin:0 0 8px;font-size:clamp(30px,4vw,54px);line-height:1;letter-spacing:-.04em}
    .hero p{margin:0;color:var(--muted);font-weight:700}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    .search,.select{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:16px;padding:12px 14px;font-weight:800}
    .search{min-width:280px;flex:1}
    .select{min-width:190px}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,26,45,.94),rgba(9,14,26,.94));border-radius:22px;padding:14px;min-height:270px;position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(92,200,255,.14),transparent 38%);pointer-events:none}
    .card.elite:before{background:radial-gradient(circle at top right,rgba(65,240,166,.18),transparent 42%)}
    .card.strong:before{background:radial-gradient(circle at top right,rgba(255,209,102,.18),transparent 42%)}
    .rank{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
    .pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;color:var(--muted);background:rgba(255,255,255,.04)}
    .score{font-size:30px;font-weight:1000;color:var(--good)}
    .name{position:relative;z-index:1;margin:14px 0 2px;font-size:20px;font-weight:1000;letter-spacing:-.02em}
    .sub{position:relative;z-index:1;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:12px}
    .mini{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
    .box{border:1px solid var(--line);border-radius:14px;padding:9px;background:rgba(255,255,255,.035)}
    .box span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}
    .box strong{display:block;margin-top:3px;font-size:15px}
    .tags{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .tag{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:11px;font-weight:800;background:rgba(0,0,0,.12)}
    .note{position:relative;z-index:1;color:var(--muted);font-size:12px;line-height:1.35;margin-top:10px;font-weight:700}
    .empty{border:1px dashed var(--line);border-radius:22px;padding:22px;color:var(--muted);font-weight:800}
    @media(max-width:1250px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.search{min-width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="brand" href="./index.html"><span class="logo"></span><span>The Slip Lab</span></a>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a href="./nba.html">Decision Center</a>
        <a href="./nba-points.html">Points Board</a>
        <a class="active" href="./nba-matchups.html">Matchups</a>
      </nav>
    </div>

    <section class="hero">
      <h1>NBA Matchup Engine</h1>
      <p id="subtitle">Loading matchup board</p>
    </section>

    <div class="controls">
      <input class="search" id="search" placeholder="Search player, team, opponent, tag" />
      <select class="select" id="tier">
        <option value="all">All matchup tiers</option>
        <option value="Elite Matchup">Elite Matchup</option>
        <option value="Strong Matchup">Strong Matchup</option>
        <option value="Playable Matchup">Playable Matchup</option>
        <option value="Neutral Matchup">Neutral Matchup</option>
        <option value="Thin Matchup">Thin Matchup</option>
      </select>
      <select class="select" id="sort">
        <option value="matchupScore">Sort by Matchup Score</option>
        <option value="pointsScore">Sort by Points Score</option>
        <option value="usageScore">Sort by Usage</option>
        <option value="volumeTrend">Sort by Volume</option>
        <option value="expectedMinutes">Sort by Minutes</option>
      </select>
    </div>

    <section id="board" class="grid"></section>
  </main>

  <script>
    let DATA=[];
    function clean(v,f="--"){return v===undefined||v===null||v===""?f:String(v)}
    function html(v){return clean(v,"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
    function fmt(v){const n=num(v);return Number.isInteger(n)?String(n):n.toFixed(1)}
    async function getJSON(file){const r=await fetch(file+"?v="+Date.now());if(!r.ok)throw new Error(file+" failed");return await r.json()}
    function cardClass(p){if(num(p.matchupScore)>=85)return"elite";if(num(p.matchupScore)>=75)return"strong";return""}
    function matches(p,q){
      if(!q)return true;
      const hay=[p.player,p.team,p.opponent,p.position,p.matchupTier,p.usageTrend,p.minutesRole,p.scoringRole,...(Array.isArray(p.tags)?p.tags:[])].join(" ").toLowerCase();
      return hay.includes(q.toLowerCase());
    }
    function render(){
      const q=document.getElementById("search").value.trim();
      const tier=document.getElementById("tier").value;
      const sort=document.getElementById("sort").value;
      const rows=DATA.filter(p=>matches(p,q)).filter(p=>tier==="all"||p.matchupTier===tier)
        .sort((a,b)=>num(b[sort])-num(a[sort])||num(b.matchupScore)-num(a.matchupScore));
      document.getElementById("board").innerHTML=rows.length?rows.map(card).join(""):`<div class="empty">No players match this filter.</div>`;
    }
    function card(p){
      return `<article class="card ${cardClass(p)}">
        <div class="rank"><span class="pill">#${html(p.rank)}</span><span class="score">${html(fmt(p.matchupScore))}</span></div>
        <div class="name">${html(p.player)}</div>
        <div class="sub">${html(p.matchup)} • ${html(p.position)} • ${html(p.matchupTier)}</div>
        <div class="mini">
          <div class="box"><span>Points</span><strong>${html(fmt(p.pointsScore))}</strong></div>
          <div class="box"><span>Lean</span><strong>${html(fmt(p.pointsLean))}</strong></div>
          <div class="box"><span>Usage</span><strong>${html(fmt(p.usageScore))}</strong></div>
          <div class="box"><span>Volume</span><strong>${html(fmt(p.volumeTrend))}</strong></div>
          <div class="box"><span>Minutes</span><strong>${html(fmt(p.expectedMinutes))}</strong></div>
          <div class="box"><span>Min Conf</span><strong>${html(fmt(p.minutesConfidence))}</strong></div>
        </div>
        <div class="tags">${(Array.isArray(p.tags)?p.tags.slice(0,6):[]).map(t=>`<span class="tag">${html(t)}</span>`).join("")}</div>
        <div class="note">${html(p.opponentContext)} • ${html(p.paceContext)}</div>
      </article>`;
    }
    async function boot(){
      const d=await getJSON("./data/nba_matchup_engine.json");
      DATA=Array.isArray(d.players)?d.players:[];
      document.getElementById("subtitle").textContent=`${DATA.length} players • ${clean(d.date)} • version ${clean(d.version)} • neutral defense/pace until real datasets are added`;
      ["search","tier","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));
      render();
    }
    boot().catch(e=>document.getElementById("board").innerHTML=`<div class="empty">${html(e.message)}</div>`);
  </script>
</body>
</html>
