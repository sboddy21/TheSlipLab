<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>The Slip Lab | AI Hall of Fame</title>

<style>
:root{
  --bg:#020806;
  --card:#07110d;
  --card2:#0b1711;
  --green:#8fff2d;
  --gold:#ffc400;
  --orange:#ff9f2d;
  --red:#ff5c52;
  --muted:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(255,196,0,.16),transparent 34%),
    radial-gradient(circle at 90% 20%,rgba(45,255,120,.14),transparent 30%),
    linear-gradient(180deg,#020806,#030806 55%,#010302);
  color:white;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:radial-gradient(rgba(143,255,45,.13) 1px,transparent 1px);
  background-size:34px 34px;
  opacity:.22;
}
.nav{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 7vw;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(143,255,45,.18);
}
.nav a{
  color:white;
  text-decoration:none;
  font-weight:1000;
  font-size:13px;
  padding:9px 15px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
}
.nav a.active{
  background:var(--gold);
  color:#111;
  box-shadow:0 0 22px rgba(255,196,0,.35);
}
.wrap{
  width:min(1500px,88vw);
  margin:0 auto;
  padding:0 0 60px;
}
.hero{
  padding:28px 20px 20px;
  border:1px solid rgba(255,196,0,.35);
  border-top:0;
  border-radius:0 0 28px 28px;
  background:linear-gradient(135deg,rgba(65,48,0,.92),rgba(4,16,10,.92));
  box-shadow:0 0 45px rgba(255,196,0,.10);
}
.kicker{
  color:var(--gold);
  font-size:12px;
  letter-spacing:2px;
  font-weight:1000;
}
h1{
  margin:6px 0 4px;
  font-size:42px;
  line-height:1;
}
.sub{
  margin:0;
  color:rgba(255,255,255,.76);
  font-weight:800;
}
.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:14px;
}
.stat{
  padding:13px;
  border-radius:16px;
  background:rgba(0,0,0,.24);
  border:1px solid rgba(255,255,255,.10);
  text-align:center;
}
.stat span{
  display:block;
  color:rgba(255,255,255,.58);
  font-size:10px;
  letter-spacing:1.4px;
  font-weight:1000;
}
.stat strong{
  display:block;
  margin-top:4px;
  color:var(--green);
  font-size:24px;
}
.controls{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin:18px 0;
}
.search{
  flex:1;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid rgba(143,255,45,.20);
  background:rgba(0,0,0,.28);
  color:white;
  font-weight:900;
  outline:none;
}
.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.filters button{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:white;
  padding:11px 13px;
  border-radius:999px;
  font-weight:1000;
  cursor:pointer;
}
.filters button.active{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
}
.section{
  margin:24px 0 12px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
}
.section h2{
  margin:0;
  font-size:24px;
}
.section p{
  margin:4px 0 0;
  color:var(--muted);
  font-weight:800;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.card{
  position:relative;
  min-height:142px;
  padding:14px;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(12,18,14,.96),rgba(14,32,17,.90));
  border:1px solid rgba(255,196,0,.40);
  box-shadow:0 0 22px rgba(255,196,0,.08);
  overflow:hidden;
}
.card.value{border-color:rgba(143,255,45,.42)}
.card.longshot{border-color:rgba(255,126,45,.44)}
.card:before{
  content:"";
  position:absolute;
  inset:-30%;
  background:radial-gradient(circle at 80% 10%,rgba(143,255,45,.12),transparent 34%);
  pointer-events:none;
}
.topline{
  position:relative;
  display:grid;
  grid-template-columns:46px 1fr 42px;
  gap:10px;
  align-items:center;
}
.avatar{
  width:46px;
  height:46px;
  border-radius:999px;
  background:#14300f;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-weight:1000;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.name{
  font-weight:1000;
  font-size:16px;
}
.meta{
  margin-top:2px;
  color:rgba(255,255,255,.58);
  font-size:11px;
  font-weight:900;
}
.grade{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid rgba(255,196,0,.65);
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
}
.score{
  position:relative;
  margin-top:14px;
  color:var(--green);
  font-size:25px;
  font-weight:1000;
}
.detail{
  position:relative;
  color:rgba(255,255,255,.68);
  font-size:12px;
  font-weight:850;
}
.badges{
  position:relative;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.badge{
  padding:5px 7px;
  border-radius:999px;
  background:rgba(255,196,0,.10);
  color:var(--gold);
  border:1px solid rgba(255,196,0,.22);
  font-size:10px;
  font-weight:1000;
}
.goat{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.goat-row{
  display:grid;
  grid-template-columns:54px 1fr 120px 120px 120px;
  gap:10px;
  align-items:center;
  padding:12px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.10);
}
.rank{
  color:var(--gold);
  font-weight:1000;
  font-size:18px;
}
.playerline{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:1000;
}
.pill{
  justify-self:end;
  color:var(--green);
  font-weight:1000;
}
.empty{
  padding:30px;
  border-radius:18px;
  color:var(--muted);
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.10);
}
@media(max-width:1100px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .goat-row{grid-template-columns:44px 1fr 80px}
  .goat-row .hide-sm{display:none}
}
@media(max-width:700px){
  .wrap{width:94vw}
  .nav{padding:10px 3vw;overflow:auto}
  .controls{flex-direction:column;align-items:stretch}
  .grid{grid-template-columns:1fr}
}
</style>
  <link rel="stylesheet" href="./assets/site-header.css?v=20260830-premium4">
  <script src="./assets/member-data.js"></script>
  <script defer src="./assets/site-header.js?v=20260906-members1"></script>
  <link rel="stylesheet" href="./assets/energy.css?v=20260830-premium">
</head>

<body class="tsl-editorial tsl-tool-page tsl-hof-page">
<nav class="nav">
  <a href="/">THE <span style="color:#8fff2d">SLIP LAB</span></a>
  <a href="/index.html">Slate</a>
  <a href="/full-board.html">Full Board</a>
  <a href="/matchup-lab.html">Matchup Lab</a>
  <a href="/power-zones.html">Power Zones</a>
  <a href="/weather.html">Weather</a>
  <a href="/results.html">Results</a>
  <a href="/decision-center.html">Decision Center</a>

</nav>

<main class="wrap">
  <div class="report-line"><span>Historical proof</span><span>Verified AI home-run calls</span></div>
  <section class="hero">
    <div class="kicker">AI HALL OF FAME</div>
    <h1>Best AI HR Calls</h1>
    <p class="sub">Historical proof that The Slip Lab AI called real home runs before they happened.</p>
    <div class="stats" id="stats"></div>
  </section>

  <section class="controls">
    <input class="search" id="search" placeholder="Search Hall of Fame by player, team, pitcher, grade..." />
    <div class="filters" id="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="best">Best Calls</button>
      <button data-filter="value">Value Hits</button>
      <button data-filter="longshot">Longshots</button>
      <button data-filter="goat">GOATs</button>
      <button data-filter="A+">A+</button>
      <button data-filter="A">A</button>
      <button data-filter="B+">B+</button>
      <button data-filter="B">B</button>
    </div>
  </section>

  <div id="content"></div>

  <div class="receipt-modal" id="receiptModal">
    <div class="receipt-box">
      <button class="receipt-close" id="receiptClose">×</button>
      <div id="receiptContent"></div>
    </div>
  </div>

  <div class="profile-modal" id="profileModal">
    <div class="profile-box">
      <button class="profile-close" id="profileClose">×</button>
      <div id="profileContent"></div>
    </div>
  </div>
</main>

<script>
let HOF = null;
let activeFilter = "all";
let query = "";

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function num(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function initials(name){
  return String(name || "?").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
}
function allCalls(){
  return [
    ...(HOF.bestCalls || []).map(r=>({...r,_type:"best"})),
    ...(HOF.valueHits || []).map(r=>({...r,_type:"value"})),
    ...(HOF.longshots || HOF.longshotLegends || []).map(r=>({...r,_type:"longshot"}))
  ];
}
function badges(r){
  const out = [];
  if(num(r.rank) === 1) out.push("🔥 #1 Pick");
  if(String(r.grade) === "A+") out.push("🏆 A+ Call");
  if(num(r.distance) >= 430) out.push("💣 430+ FT");
  if(r._type === "value") out.push("💰 Value Smash");
  if(r._type === "longshot") out.push("🎯 Longshot Legend");
  if(num(r.exitVelocity) >= 108) out.push("⚡ Hard Contact");
  return out.slice(0,3);
}
function groupPlayers(list){
  const map = new Map();

  list.forEach(r=>{
    const key = String(r.player || "").trim();
    if(!key) return;

    if(!map.has(key)){
      map.set(key, {
        player:r.player,
        playerId:r.playerId,
        headshot:r.headshot,
        team:r.team,
        calls:[],
        bestScore:0,
        bestRank:999,
        bestGrade:"B",
        longest:0,
        type:r._type
      });
    }

    const g = map.get(key);
    g.calls.push(r);
    g.bestScore = Math.max(g.bestScore, num(r.score));
    g.bestRank = Math.min(g.bestRank, num(r.rank) || 999);
    g.longest = Math.max(g.longest, num(r.distance));

    const order = {"A+":5,"A":4,"B+":3,"B":2,"C":1};
    if((order[r.grade] || 0) > (order[g.bestGrade] || 0)) g.bestGrade = r.grade;

    if(r.headshot) g.headshot = r.headshot;
  });

  return [...map.values()].sort((a,b)=>
    b.calls.length - a.calls.length ||
    b.bestScore - a.bestScore ||
    a.bestRank - b.bestRank
  );
}

function playerCard(g){
  const latest = [...g.calls].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0] || {};
  const timeline = [...g.calls]
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)))
    .slice(0,8);

  const badgeList = [];
  if(g.bestRank === 1) badgeList.push("🔥 #1 Pick");
  if(g.bestGrade === "A+") badgeList.push("🏆 A+ Call");
  if(g.longest >= 430) badgeList.push("💣 430+ FT");
  if(g.calls.length >= 5) badgeList.push("🐐 Repeat Hit");
  if(g.type === "value") badgeList.push("💰 Value Smash");
  if(g.type === "longshot") badgeList.push("🎯 Longshot Legend");

  return `
    <article class="card player-hof-card ${g.type || ""}">
      <div class="topline">
        <div class="avatar">${g.headshot ? `<img src="${esc(g.headshot)}" alt="">` : esc(initials(g.player))}</div>
        <div>
          <div class="name">${esc(g.player)}</div>
          <div class="meta">${g.calls.length} AI HR calls • Best Rank #${g.bestRank === 999 ? "-" : g.bestRank}</div>
        </div>
        <div class="grade">${esc(g.bestGrade || "B")}</div>
      </div>

      <div class="hof-player-stats">
        <div><span>AI Hits</span><b>${g.calls.length}</b></div>
        <div><span>Best Score</span><b>${g.bestScore.toFixed(1)}</b></div>
        <div><span>Longest</span><b>${g.longest || "-"} ft</b></div>
      </div>

      <div class="detail">Latest: ${esc(latest.date || "-")} vs ${esc(latest.pitcher || "TBD")}</div>
      <div class="badges">${badgeList.slice(0,4).map(b=>`<span class="badge">${b}</span>`).join("")}</div>

      <div class="hof-actions">
        <button class="profile-btn" data-ai-profile-player="${esc(g.player)}">👤 AI Player Profile</button>
        <button class="receipt-btn" data-receipt-player="${esc(g.player)}">📄 View Receipt</button>
      </div>

      <details class="timeline">
        <summary>View Timeline</summary>
        <div class="timeline-list">
          ${timeline.map(r=>`
            <div class="timeline-row">
              <span>${esc(r.date || "-")}</span>
              <b>${esc(r.distance || "-")} ft</b>
              <small>Rank #${esc(r.rank || "-")} • ${esc(r.grade || "B")} • vs ${esc(r.pitcher || "TBD")}</small>
            </div>
          `).join("")}
        </div>
      </details>
    </article>
  `;
}

function card(r){
  return playerCard(groupPlayers([r])[0]);
}
function goatBoard(){
  const source = HOF.goatBoard || [];
  return source.map((r,i)=>`
    <div class="goat-row">
      <div class="rank">#${i+1}</div>
      <div class="playerline">
        <div class="avatar">${r.headshot ? `<img src="${esc(r.headshot)}" alt="">` : esc(initials(r.player))}</div>
        <span>${esc(r.player)}</span>
      </div>
      <div class="pill">${esc(r.hrCount || r.hits || r.total || 0)} HR</div>
      <div class="pill hide-sm">Best #${esc(r.bestRank || r.rank || "-")}</div>
      <div class="pill hide-sm">${esc(r.avgGrade || r.grade || "AI")}</div>
    </div>
  `).join("");
}
function section(title, sub, html){
  return `
    <div class="section">
      <div>
        <h2>${title}</h2>
        <p>${sub}</p>
      </div>
    </div>
    ${html || `<div class="empty">No results found.</div>`}
  `;
}
function filterCalls(){
  let rows = allCalls();

  if(activeFilter === "best") rows = rows.filter(r=>r._type === "best");
  else if(activeFilter === "value") rows = rows.filter(r=>r._type === "value");
  else if(activeFilter === "longshot") rows = rows.filter(r=>r._type === "longshot");
  else if(["A+","A","B+","B"].includes(activeFilter)) rows = rows.filter(r=>String(r.grade) === activeFilter);

  if(query){
    const q = query.toLowerCase();
    rows = rows.filter(r => [
      r.player,r.team,r.opponent,r.pitcher,r.grade,r.date,r.pitchType
    ].join(" ").toLowerCase().includes(q));
  }

  return rows;
}
function renderStats(){
  const biggest = allCalls().sort((a,b)=>num(b.distance)-num(a.distance))[0] || {};
  document.getElementById("stats").innerHTML = `
    <div class="stat"><span>TOTAL AI HITS</span><strong>${esc(HOF.totalAiHits || allCalls().length)}</strong></div>
    <div class="stat"><span>A+ CALLS</span><strong>${esc(HOF.gradeTotals?.["A+"] || 0)}</strong></div>
    <div class="stat"><span>A CALLS</span><strong>${esc(HOF.gradeTotals?.["A"] || 0)}</strong></div>
    <div class="stat"><span>GOATS</span><strong>${esc(HOF.goatBoard?.length || 0)}</strong></div>
    <div class="stat"><span>BIGGEST BLAST</span><strong>${esc(biggest.distance || "-")} FT</strong></div>
  `;
}
function render(){
  if(!HOF) return;
  renderStats();

  const content = document.getElementById("content");

  if(activeFilter === "goat"){
    content.innerHTML = section("AI GOAT Leaderboard", "Players with the most AI called home runs.", `<div class="goat">${goatBoard()}</div>`);
    wireReceipts();
    wireProfiles();
    return;
  }

  const rows = filterCalls();

  if(activeFilter !== "all" || query){
    const grouped = groupPlayers(rows);
    content.innerHTML = section("Filtered AI Players", `${grouped.length} matching players from ${rows.length} historical AI calls.`, `<div class="grid">${grouped.map(playerCard).join("")}</div>`);
    wireReceipts();
    wireProfiles();
    return;
  }

  const bestGrouped = groupPlayers((HOF.bestCalls || []).map(r=>({...r,_type:"best"}))).slice(0,12);
  const valueGrouped = groupPlayers((HOF.valueHits || []).map(r=>({...r,_type:"value"}))).slice(0,12);
  const longshotGrouped = groupPlayers((HOF.longshots || HOF.longshotLegends || []).map(r=>({...r,_type:"longshot"}))).slice(0,12);

  content.innerHTML = `
    ${section("Best AI Calls", "The cleanest, highest graded AI home run hitters, grouped by player.", `<div class="grid">${bestGrouped.map(playerCard).join("")}</div>`)}
    ${section("Value Hits", "Players where the model repeatedly found strong market value.", `<div class="grid">${valueGrouped.map(playerCard).join("")}</div>`)}
    ${section("Longshot Legends", "Higher risk AI hitters that still left the yard.", `<div class="grid">${longshotGrouped.map(playerCard).join("")}</div>`)}
    ${section("AI GOAT Leaderboard", "The players who keep rewarding the model.", `<div class="goat">${goatBoard()}</div>`)}
  `;
  wireReceipts();
    wireProfiles();
}



function gradeRank(g){
  return {"A+":5,"A":4,"B+":3,"B":2,"C":1}[String(g || "").trim()] || 0;
}

function avg(arr){
  return arr.length ? arr.reduce((a,b)=>a+num(b),0) / arr.length : 0;
}

function profileHtml(player){
  const calls = findPlayerCalls(player);
  const best = [...calls].sort((a,b)=>
    gradeRank(b.grade) - gradeRank(a.grade) ||
    num(b.score)-num(a.score) ||
    num(a.rank)-num(b.rank)
  )[0] || {};

  const longest = [...calls].sort((a,b)=>num(b.distance)-num(a.distance))[0] || {};
  const bestRank = Math.min(...calls.map(r=>num(r.rank) || 999));
  const avgScore = avg(calls.map(r=>r.score));
  const avgDistance = avg(calls.map(r=>r.distance));
  const grades = calls.reduce((acc,r)=>{
    const g = r.grade || "B";
    acc[g] = (acc[g] || 0) + 1;
    return acc;
  }, {});

  const teams = [...new Set(calls.map(r=>r.team).filter(Boolean))].join(", ");
  const pitchers = [...new Set(calls.map(r=>r.pitcher).filter(Boolean))].slice(0,8);

  return `
    <div class="career-head">
      <div class="avatar big">${best.headshot ? `<img src="${esc(best.headshot)}" alt="">` : esc(initials(player))}</div>
      <div>
        <span>AI CAREER PROFILE</span>
        <h2>${esc(player)}</h2>
        <p>${esc(teams || "Historical AI HR profile")}</p>
      </div>
    </div>

    <div class="career-stats">
      <div><span>AI HR Calls</span><b>${calls.length}</b></div>
      <div><span>Best Rank</span><b>#${bestRank === 999 ? "-" : bestRank}</b></div>
      <div><span>Best Grade</span><b>${esc(best.grade || "-")}</b></div>
      <div><span>Avg Score</span><b>${avgScore.toFixed(1)}</b></div>
      <div><span>Longest HR</span><b>${esc(longest.distance || "-")} ft</b></div>
      <div><span>Avg Distance</span><b>${avgDistance.toFixed(0)} ft</b></div>
    </div>

    <div class="career-section">
      <h3>AI Career Summary</h3>
      <p>
        ${esc(player)} has been one of the model's historical HR hits with <b>${calls.length}</b> AI-called home runs.
        His best model profile was a <b>${esc(best.grade || "-")}</b> grade, ranked <b>#${esc(best.rank || "-")}</b>,
        with a score of <b>${num(best.score).toFixed(1)}</b>. The longest tracked home run in the Hall of Fame profile
        was <b>${esc(longest.distance || "-")} feet</b>.
      </p>
    </div>

    <div class="career-split">
      <div class="career-section">
        <h3>Grade Breakdown</h3>
        <div class="grade-breakdown">
          ${["A+","A","B+","B","C"].map(g=>`
            <div>
              <span>${g}</span>
              <b>${grades[g] || 0}</b>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="career-section">

            <b>${esc(r.grade || "B")} • Rank #${esc(r.rank || "-")}</b>
            <em>${esc(r.distance || "-")} ft</em>
            <small>${esc(r.team || "")} vs ${esc(r.opponent || "")} • vs ${esc(r.pitcher || "TBD")}</small>

function openProfile(player){
  document.getElementById("profileContent").innerHTML = profileHtml(player);
  document.getElementById("profileModal").classList.add("open");
}

function wireProfiles(){
  document.querySelectorAll("[data-profile-player]").forEach(btn=>{
    btn.onclick = ()=>{
      openProfile(btn.dataset.profilePlayer);
    };
  });
}

document.getElementById("profileClose").addEventListener("click", ()=>{
  document.getElementById("profileModal").classList.remove("open");
});

document.getElementById("profileModal").addEventListener("click", e=>{
  if(e.target.id === "profileModal"){
    e.currentTarget.classList.remove("open");
  }
});


function findPlayerCalls(player){
  return allCalls()
    .filter(r=>String(r.player || "") === String(player || ""))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

function receiptHtml(player){
  const calls = findPlayerCalls(player);
  const best = [...calls].sort((a,b)=>
    num(b.score)-num(a.score) ||
    num(a.rank)-num(b.rank)
  )[0] || {};

  return `
    <div class="receipt-head">
      <span>THE SLIP LAB RECEIPT</span>
      <h2>${esc(player)}</h2>
      <p>Proof of the AI call before the home run result.</p>
    </div>

    <div class="receipt-proof">
      <div>
        <span>Best AI Grade</span>
        <b>${esc(best.grade || "-")}</b>
      </div>
      <div>
        <span>Best Rank</span>
        <b>#${esc(best.rank || "-")}</b>
      </div>
      <div>
        <span>Best Score</span>
        <b>${num(best.score).toFixed(1)}</b>
      </div>
      <div>
        <span>Total AI HR Calls</span>
        <b>${calls.length}</b>
      </div>
    </div>

    <div class="receipt-callout">
      <b>Original AI Call:</b>
      The model had ${esc(player)} graded as a ${esc(best.grade || "tracked")} HR target with a score of ${num(best.score).toFixed(1)} and rank #${esc(best.rank || "-")} before he homered against ${esc(best.pitcher || "the opposing pitcher")}.
    </div>

    <div class="receipt-table">
      ${calls.map(r=>`
        <div class="receipt-row">
          <span>${esc(r.date || "-")}</span>
          <b>${esc(r.grade || "B")} • Rank #${esc(r.rank || "-")}</b>
          <em>${esc(r.distance || "-")} ft</em>
          <small>vs ${esc(r.pitcher || "TBD")} • ${esc(r.pitchType || "Pitch TBD")}</small>
        </div>
      `).join("")}
    </div>
  `;
}

function openReceipt(player){
  document.getElementById("receiptContent").innerHTML = receiptHtml(player);
  document.getElementById("receiptModal").classList.add("open");
}

function wireReceipts(){
  document.querySelectorAll("[data-receipt-player]").forEach(btn=>{
    btn.onclick = ()=>{
      openReceipt(btn.dataset.receiptPlayer);
    };
  });
}

document.getElementById("receiptClose").addEventListener("click", ()=>{
  document.getElementById("receiptModal").classList.remove("open");
});

document.getElementById("receiptModal").addEventListener("click", e=>{
  if(e.target.id === "receiptModal"){
    e.currentTarget.classList.remove("open");
  }
});


document.getElementById("filters").addEventListener("click", e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("active", b === btn));
  render();
});
document.getElementById("search").addEventListener("input", e=>{
  query = e.target.value.trim();
  render();
});

async function load(){
  HOF = await (await fetch("./data/hr_ai_hof.json?v=" + Date.now())).json();
  render();
}
load();
