<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Slip Lab | NBA Assists Board</title>
  <style>
    :root{--bg:#050814;--panel:#0b1220;--text:#f5f7fb;--muted:#99a6bd;--line:rgba(255,255,255,.1);--good:#41f0a6;--warn:#ffd166;--hot:#ff5c7a;--blue:#5cc8ff}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top left,rgba(92,200,255,.14),transparent 30%),radial-gradient(circle at top right,rgba(255,92,122,.12),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1500px;margin:0 auto;padding:22px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--hot))}
    .nav{display:flex;gap:10px;flex-wrap:wrap}
    .nav a{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);font-weight:800;font-size:13px}
    .nav a.active{color:var(--text);border-color:rgba(92,200,255,.45)}
    .hero{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(17,26,45,.92),rgba(11,18,32,.9));padding:26px;margin-bottom:18px}
    .hero h1{margin:0 0 8px;font-size:clamp(30px,4vw,54px);line-height:1;letter-spacing:-.04em}
    .hero p{margin:0;color:var(--muted);font-weight:700}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    .search,.select{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:16px;padding:12px 14px;font-weight:800}
    .search{min-width:280px;flex:1}
    .select{min-width:190px}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,26,45,.94),rgba(9,14,26,.94));border-radius:22px;padding:14px;min-height:270px;position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(92,200,255,.14),transparent 38%);pointer-events:none}
    .card.elite:before{background:radial-gradient(circle at top right,rgba(65,240,166,.18),transparent 42%)}
    .card.strong:before{background:radial-gradient(circle at top right,rgba(255,209,102,.18),transparent 42%)}
    .rank{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
    .pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;color:var(--muted);background:rgba(255,255,255,.04)}
    .score{font-size:30px;font-weight:1000;color:var(--good)}
    .name{position:relative;z-index:1;margin:14px 0 2px;font-size:20px;font-weight:1000;letter-spacing:-.02em}
    .sub{position:relative;z-index:1;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:12px}
    .mini{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
    .box{border:1px solid var(--line);border-radius:14px;padding:9px;background:rgba(255,255,255,.035)}
    .box span{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}
    .box strong{display:block;margin-top:3px;font-size:15px}
    .tags{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .tag{border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);font-size:11px;font-weight:800;background:rgba(0,0,0,.12)}
    .tag.good{color:var(--good);border-color:rgba(65,240,166,.38);background:rgba(65,240,166,.10)}
    .tag.warn{color:var(--warn);border-color:rgba(255,209,102,.38);background:rgba(255,209,102,.10)}
    .tag.hot{color:var(--hot);border-color:rgba(255,92,122,.38);background:rgba(255,92,122,.10)}
    .tag.blue{color:var(--blue);border-color:rgba(92,200,255,.38);background:rgba(92,200,255,.10)}
    .play-grade{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:rgba(255,255,255,.05)}
    .play-grade.elite{color:var(--good);border-color:rgba(65,240,166,.45);background:rgba(65,240,166,.12);box-shadow:0 0 18px rgba(65,240,166,.14)}
    .play-grade.strong{color:var(--blue);border-color:rgba(92,200,255,.45);background:rgba(92,200,255,.12)}
    .play-grade.good{color:var(--warn);border-color:rgba(255,209,102,.45);background:rgba(255,209,102,.12)}
    .play-grade.watch{color:var(--hot);border-color:rgba(255,92,122,.45);background:rgba(255,92,122,.12)}
    .play-grade.avoid{color:var(--muted)}
    .note{position:relative;z-index:1;color:var(--muted);font-size:12px;line-height:1.35;margin-top:10px;font-weight:700}
    .slate-panel{border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.04);padding:14px;margin:0 0 18px}
    .slate-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
    .slate-head h2{margin:0;font-size:18px;letter-spacing:-.02em}
    .slate-head span{color:var(--muted);font-size:12px;font-weight:850}
    .slate-games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .slate-game{border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.12);padding:11px}
    .slate-matchup{font-weight:1000;font-size:14px;margin-bottom:5px}
    .slate-meta{color:var(--muted);font-size:12px;font-weight:800}
    .slate-live{color:var(--good)}
    .slate-final{color:var(--warn)}
    .slate-pregame{color:var(--blue)}
    @media(max-width:900px){.slate-games{grid-template-columns:1fr}}

    .empty{border:1px dashed var(--line);border-radius:22px;padding:22px;color:var(--muted);font-weight:800}
    @media(max-width:1250px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.search{min-width:100%}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
    .modal.show{display:flex}
    .modal-card{width:min(980px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#111a2d,#070b15);padding:20px;box-shadow:0 24px 90px rgba(0,0,0,.5)}
    .modal-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:14px}
    .modal-head h2{margin:0;font-size:32px;letter-spacing:-.04em}
    .modal-head p{margin:5px 0 0;color:var(--muted);font-weight:800}
    .close{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}
    .modal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
    .modal-section{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.035);padding:14px;margin:12px 0}
    .modal-section h3{margin:0 0 10px;font-size:16px;letter-spacing:-.02em}
    .modal-note{color:var(--muted);font-size:13px;font-weight:750;line-height:1.45}
    .profile-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin:12px 0}
    .profile-main-number{border:1px solid rgba(65,240,166,.35);border-radius:20px;padding:16px;background:rgba(65,240,166,.08)}
    .profile-main-number span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:950;letter-spacing:.08em}
    .profile-main-number strong{display:block;color:var(--good);font-size:42px;line-height:1;margin-top:6px}
    .profile-context{border:1px solid var(--line);border-radius:20px;padding:16px;background:rgba(92,200,255,.06)}
    .profile-context b{display:block;font-size:18px;margin-bottom:5px}
    .profile-context p{margin:0;color:var(--muted);font-weight:750;line-height:1.35}
    .log{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
    .log th,.log td{border-bottom:1px solid var(--line);padding:9px;text-align:left}
    .log th{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
    @media(max-width:760px){.modal-grid{grid-template-columns:repeat(2,1fr)}.profile-hero{grid-template-columns:1fr}}
  
  </style>
  <link rel="stylesheet" href="./assets/site-header.css?v=20260830-premium4">
  <script src="./assets/member-data.js"></script>
  <script defer src="./assets/site-header.js?v=20260906-members1"></script>
  <link rel="stylesheet" href="./assets/energy.css?v=20260830-premium">
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="brand" href="./index.html"><span class="logo"></span><span>The Slip Lab</span></a>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a href="./nba.html">NBA Decision Center</a>
        <a href="./nba-points.html">Points Board</a>
        <a class="active" href="./nba-matchups.html">Matchups</a>
        <a href="./nba-rebounds.html">Rebounds</a>
        <a href="./nba-assists.html">Assists</a>
        <a href="./nba-threes.html">Threes</a>
      </nav>
    </div>

    <section id="nbaSlatePanel" class="slate-panel">Loading NBA slate</section>

    <section class="hero">
      <h1>NBA Assists Board</h1>
      <p id="subtitle">Loading board</p>
    </section>

    <div class="controls">
      <input class="search" id="search" placeholder="Search player, team, opponent, tag" />
      <select class="select" id="tier">
        <option value="all">All matchup tiers</option>
        <option value="Elite Matchup">Elite Matchup</option>
        <option value="Strong Matchup">Strong Matchup</option>
        <option value="Playable Matchup">Playable Matchup</option>
        <option value="Neutral Matchup">Neutral Matchup</option>
        <option value="Thin Matchup">Thin Matchup</option>
      </select>
      <select class="select" id="sort">
        <option value="assistsScore">Sort by Assists Score</option>
        <option value="assistsScore">Sort by Assists Score</option>
        <option value="usageScore">Sort by Usage</option>
        <option value="volumeTrend">Sort by Volume</option>
        <option value="expectedMinutes">Sort by Minutes</option>
      </select>
      <button class="clear-btn" id="clearFilters" type="button">Clear</button>
    </div>

    <section id="board" class="grid"></section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div id="modalBody"></div>
    </div>
  </div>



  <script>
    let DATA=[];
    let CARDS=[];
    let MARKET_DATA=[];
    let NO_GAMES=false;
    function clean(v,f="--"){return v===undefined||v===null||v===""?f:String(v)}
    function html(v){return clean(v,"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
    function fmt(v){const n=num(v);return Number.isInteger(n)?String(n):n.toFixed(1)}
    async function getJSON(file){const r=await fetch(file+"?v="+Date.now());if(!r.ok)throw new Error(file+" failed");return await r.json()}

    function gameStatusClass(game){
      const status=Number(game?.gameStatus||0);
      if(status===2)return"slate-live";
      if(status===3)return"slate-final";
      return"slate-pregame";
    }

    function gameStatusLabel(game){
      const status=Number(game?.gameStatus||0);
      if(status===2)return game?.clock ? `LIVE • Q${game.period} ${game.clock}` : `LIVE • Q${game.period||""}`;
      if(status===3)return"FINAL";
      return game?.gameStatusText || "Pregame";
    }

    function teamLine(team){
      if(!team)return"--";
      const abbr=team.abbreviation||team.team||"--";
      const score=Number(team.score||0);
      return score>0?`${abbr} ${score}`:abbr;
    }

    async function renderSlatePanel(){
      const panel=document.getElementById("nbaSlatePanel");
      if(!panel)return;

      try{
        const slate=await getJSON("./data/nba_games_today.json");
        const games=Array.isArray(slate.games)?slate.games:[];
        NO_GAMES=slate.availability==="no_games_scheduled";
        panel.innerHTML=`
          <div class="slate-head">
            <h2>Today’s NBA Slate</h2>
            <span>${games.length} game${games.length===1?"":"s"} • Updated ${clean(slate.fetchedAt,"--")}</span>
          </div>
          <div class="slate-games">
            ${games.map(game=>`
              <div class="slate-game">
                <div class="slate-matchup">${html(teamLine(game.awayTeam))} at ${html(teamLine(game.homeTeam))}</div>
                <div class="slate-meta ${gameStatusClass(game)}">${html(gameStatusLabel(game))}</div>
              </div>
            `).join("") || `<div class="slate-game"><div class="slate-meta">NBA Offseason — No Games Scheduled</div></div>`}
          </div>
        `;
      }catch(e){
        panel.innerHTML=`<div class="slate-head"><h2>Today’s NBA Slate</h2><span>Slate unavailable</span></div>`;
      }
    }
    function gradeClass(grade){
      const g=String(grade||"").toLowerCase();
      if(g.includes("elite"))return"elite";
      if(g.includes("strong"))return"strong";
      if(g.includes("good"))return"good";
      if(g.includes("watch"))return"watch";
      if(g.includes("avoid"))return"avoid";
      return"";
    }

    function tagClass(tag){
      const t = String(tag || "").toLowerCase();
      if (t.includes("edge") || t.includes("pace up") || t.includes("usage up") || t.includes("usage spike") || t.includes("core minutes") || t.includes("minutes boost") || t.includes("attackable")) return "good";
      if (t.includes("strong") || t.includes("playable") || t.includes("high usage") || t.includes("home spot")) return "blue";
      if (t.includes("warning") || t.includes("tough") || t.includes("slow pace") || t.includes("elite defender")) return "hot";
      if (t.includes("watch") || t.includes("neutral") || t.includes("average")) return "warn";
      return "";
    }

    function renderTags(tags, limit = 8){
      return (Array.isArray(tags) ? tags.slice(0, limit) : [])
        .map(t => `<span class="tag ${tagClass(t)}">${html(t)}</span>`)
        .join("");
    }

    function cardClass(p){if(num(p.assistsScore)>=85)return"elite";if(num(p.assistsScore)>=75)return"strong";return""}
    function matches(p,q){
      if(!q)return true;
      const hay=[p.player,p.team,p.opponent,p.position,p.matchupTier,p.usageTrend,p.minutesRole,p.scoringRole,...(Array.isArray(p.tags)?p.tags:[])].join(" ").toLowerCase();
      return hay.includes(q.toLowerCase());
    }
    function fillTeams(){
      const select=document.getElementById("team");
      if(!select)return;

      const current=select.value || "all";
      const teams=[...new Set(DATA.map(p=>p.team).filter(Boolean))].sort();

      select.innerHTML=`<option value="all">All Teams</option>`+
        teams.map(t=>`<option value="${html(t)}">${html(t)}</option>`).join("");

      select.value=teams.includes(current)?current:"all";
    }

    function render(){
      const q=document.getElementById("search").value.trim();
      const tier=document.getElementById("tier").value;
      const sort=document.getElementById("sort").value;
      const rows=DATA.filter(p=>matches(p,q)).filter(p=>tier==="all"||p.matchupTier===tier)
        .sort((a,b)=>num(b[sort])-num(a[sort])||num(b.assistsScore)-num(a.assistsScore));
      document.getElementById("board").innerHTML=rows.length
        ? rows.map(card).join("")
        : `<div class="empty">${NO_GAMES ? "NBA Offseason — No Games Scheduled. Live assists projections will return when the schedule resumes." : "No players match this filter."}</div>`;
      installCards();

    }
    function findMarketRow(playerId){
      return MARKET_DATA.find(p=>String(p.playerId)===String(playerId));
    }

    function findCard(playerId){
      const card=CARDS.find(p=>String(p.playerId)===String(playerId));
      const market=findMarketRow(playerId);
      if(!card)return market || null;

      return {
        ...card,
        marketRow: market || null,
        headline: {
          ...(card.headline || {}),
          assistsLean: market?.assistsLean ?? card.headline?.assistsLean,
          assistsScore: market?.assistsScore ?? card.headline?.assistsScore,
          playGrade: market?.playGrade ?? card.headline?.playGrade,
          confidence: market?.confidence ?? card.headline?.confidence
        }
      };
    }
    function metric(label,value){
      return `<div class="box"><span>${html(label)}</span><strong>${html(fmt(value))}</strong></div>`;
    }
    function openCard(playerId){
      const p=findCard(playerId);
      if(!p)return;

      const logs=Array.isArray(p.recentGames)?p.recentGames.slice(0,8):[];
      const tags=Array.isArray(p.tags)?p.tags:[];
      const topTags=tags.slice(0,14).map(t=>`<span class="tag ${typeof tagClass==="function"?tagClass(t):""}">${html(t)}</span>`).join("");

      const projection=p.headline?.assistsLean ?? p.marketRow?.assistsLean;
      const marketScore=p.headline?.assistsScore ?? p.marketRow?.assistsScore;

      document.getElementById("modalBody").innerHTML=`<section data-odds-sport="NBA" data-odds-player="${html(p.player)}" data-odds-player-id="${html(p.playerId)}" data-odds-game-id="${html(p.gameId || '')}" data-odds-team="${html(p.team)}"></section>
        <div class="modal-head">
          <div>
            <h2>${html(p.player)}</h2>
            <p>${html(p.team)} vs ${html(p.opponent)} • ${html(p.position)} • ${html(p.homeAway)} • ${html(p.headline?.confidence)}</p>
          </div>
          <button class="close" id="closeModal">Close</button>
        </div>

        <div class="profile-hero">
          <div class="profile-main-number">
            <span>Projected Assists</span>
            <strong>${html(fmt(projection))}</strong>
          </div>
          <div class="profile-context">
            <b>${html(p.headline?.confidence || "NBA Profile")}</b>
            <p>${html(p.matchup?.opponentContext || "Opponent context loading")}</p>
            <p>${html(p.matchup?.paceContext || "")}</p>
          </div>
        </div>

        <div class="play-grade ${gradeClass(p.headline?.playGrade)}">${html(p.headline?.playGrade || p.headline?.confidence || "WATCH LIST")}</div>
        <div class="tags">${topTags}</div>

        <div class="modal-section">
          <h3>Projection Summary</h3>
          <div class="modal-grid">
            ${metric("Projected Assists",projection)}
            ${metric("Model Score",marketScore)}
            ${metric("Expected Minutes",p.minutes?.expected)}
            ${metric("Minutes Confidence",p.minutes?.confidence)}
            ${metric("Assists Score",marketScore)}
            ${metric("Projected Assists",projection)}
            ${metric("Season Points",p.production?.seasonPoints)}
            ${metric("Last 5 Points",p.production?.last5Points)}
          </div>
        </div>

        <div class="modal-section">
          <h3>Usage and Volume</h3>
          <div class="modal-grid">
            ${metric("FGA Trend",p.usage?.fgaTrend)}
            ${metric("FTA Trend",p.usage?.ftaTrend)}
            ${metric("Volume Trend",p.usage?.volumeTrend)}
            ${metric("Usage Trend",p.usage?.trend || p.headline?.usageTrend)}
          </div>
        </div>

        <div class="modal-section">
          <h3>Matchup Intelligence</h3>
          <div class="modal-grid">
            ${metric("Matchup Grade",p.matchup?.matchupTier)}
            ${metric("Matchup Score",p.headline?.matchupScore)}
            ${metric("Defense Tier",p.matchup?.defense?.defensiveTier)}
            ${metric("Pace Tier",p.matchup?.pace?.paceTier)}
            ${metric("Opp PPG Allowed",p.matchup?.defense?.pointsAllowed)}
            ${metric("Pace Rank",p.matchup?.pace?.rankPace)}
            ${metric("Reb Allowed",p.matchup?.defense?.reboundsAllowed)}
            ${metric("Ast Allowed",p.matchup?.defense?.assistsAllowed)}
          </div>
          <div class="modal-note">
            ${html(p.matchup?.opponentContext || "")}<br/>
            ${html(p.matchup?.paceContext || "")}<br/>
            ${html(p.matchup?.defenderContext || "")}
          </div>
        </div>

        <div class="modal-section">
          <h3>Defender Context</h3>
          <div class="modal-note">
            ${(Array.isArray(p.matchup?.topDefenders) && p.matchup.topDefenders.length)
              ? p.matchup.topDefenders.slice(0,5).map(d =>
                  `${html(d.player)} • ${html(d.position || "DEF")} • ${html(d.tier || "Tracked Defender")} • ${html(d.pctPlusMinus)}`
                ).join("<br/>")
              : "No defender tracking context available yet."}
          </div>
        </div>

        <div class="modal-section">
          <h3>Recent Game Log</h3>
          <table class="log">
            <thead><tr><th>Date</th><th>Matchup</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>3PM</th><th>FGA</th><th>FTA</th></tr></thead>
            <tbody>
              ${logs.map(g=>`<tr><td>${html(g.date)}</td><td>${html(g.matchup)}</td><td>${html(fmt(g.minutes))}</td><td>${html(fmt(g.points))}</td><td>${html(fmt(g.rebounds))}</td><td>${html(fmt(g.assists))}</td><td>${html(fmt(g.threesMade))}</td><td>${html(fmt(g.fieldGoalAttempts))}</td><td>${html(fmt(g.freeThrowAttempts))}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById("modal").classList.add("show");
      document.getElementById("closeModal").addEventListener("click",()=>document.getElementById("modal").classList.remove("show"));
    }

    function installCards(){
      document.querySelectorAll(".card[data-player-id]").forEach(card=>{
        card.addEventListener("click",()=>openCard(card.dataset.playerId));
        card.addEventListener("keydown",e=>{if(e.key==="Enter")openCard(card.dataset.playerId)});
      });
    }


    function card(p){
      return `<article class="card ${cardClass(p)}" data-player-id="${html(p.playerId)}" role="button" tabindex="0">
        <div class="rank"><span class="pill">#${html(p.rank)}</span><span class="score">${html(fmt(p.assistsLean))}</span></div>
        <div class="name">${html(p.player)}</div>
        <div class="sub">${html(p.matchup)} • ${html(p.position)} • ${html(p.matchupTier)}</div>
        <div class="mini">
          <div class="box"><span>Projected Assists</span><strong>${html(fmt(p.assistsLean))}</strong></div>
          <div class="box"><span>Assists Score</span><strong>${html(fmt(p.assistsScore))}</strong></div>
          <div class="box"><span>Usage</span><strong>${html(fmt(p.usageScore))}</strong></div>
          <div class="box"><span>Volume</span><strong>${html(fmt(p.volumeTrend))}</strong></div>
          <div class="box"><span>Minutes</span><strong>${html(fmt(p.expectedMinutes))}</strong></div>
          <div class="box"><span>Min Conf</span><strong>${html(fmt(p.minutesConfidence))}</strong></div>
        </div>
        <div class="tags">${renderTags(p.tags, 9)}</div>
        <div class="note">${html(p.opponentContext)} • ${html(p.paceContext)}</div>
      </article>`;
    }
    async function boot(){
      const cards=await getJSON("./data/nba_player_cards.json");
      const d=await getJSON("./data/nba_assists.json");
      CARDS=Array.isArray(cards.players)?cards.players:[];
      MARKET_DATA=Array.isArray(d.players)?d.players:[];
      NO_GAMES=d.availability==="no_games_scheduled";
      const cardMap=new Map(CARDS.map(card=>[String(card.playerId),card]));
      DATA=MARKET_DATA.map(row=>{
        const context=cardMap.get(String(row.playerId))?.matchup||{};
        return {...row,matchup:context.matchup||`${row.team} vs ${row.opponent}`,matchupTier:context.matchupTier||"",opponentContext:context.opponentContext||"",paceContext:context.paceContext||""};
      });
      document.getElementById("subtitle").textContent=NO_GAMES
        ? `NBA Offseason • No games scheduled • ${clean(d.date)}`
        : `${DATA.length} players • ${clean(d.market)} • ${clean(d.date)} • version ${clean(d.version)}`;
      fillTeams();
      ["search","team","tier","minProjection","minScore","sort"].forEach(id=>{
        const el=document.getElementById(id);
        if(el)el.addEventListener("input",render);
        if(el)el.addEventListener("change",render);
      });
      document.getElementById("clearFilters").addEventListener("click",()=>{
        document.getElementById("search").value="";
        document.getElementById("team").value="all";
        document.getElementById("tier").value="all";
        document.getElementById("minProjection").value="0";
        document.getElementById("minScore").value="0";
        render();
      });
      await renderSlatePanel();
      render();
    }
    document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show")});
    boot().catch(e=>document.getElementById("board").innerHTML=`<div class="empty">${html(e.message)}</div>`);
  </script>
  <script defer src="./assets/nfl-coming-soon.js?v=20260830-private"></script>
</body>
</html>
